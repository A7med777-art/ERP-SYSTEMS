name: Publish site

# Every change to index.html on the default branch is copied to the gh-pages
# branch (which GitHub Pages serves), then the live site and the database are checked.
on:
  push:
    branches: [main, claude/magical-pascal-dvin1v]
    paths: [index.html, CNAME, scripts/verify.sh, .github/workflows/pages.yml]
  workflow_dispatch:
    inputs:
      insert_test:
        description: "Also send one real test sign-up (marked 'Deploy check')"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sanity-check the page
        run: |
          test -s index.html
          grep -q '</html>' index.html
          grep -q 'id="jform"' index.html

      - name: Push to gh-pages
        run: |
          mkdir site
          cp index.html site/index.html
          cp index.html site/404.html
          touch site/.nojekyll
          # Custom domain: put the hostname (e.g. systems.concretech-trading.com) in a CNAME file
          # at the repo root only after its DNS record points to <owner>.github.io.
          if [ -s CNAME ]; then cp CNAME site/CNAME; fi
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Verify live site and database
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          INSERT_TEST: ${{ inputs.insert_test || 'false' }}
        run: |
          if [ -s CNAME ]; then export SITE_URL="https://$(tr -d '[:space:]' < CNAME)/"; fi
          bash scripts/verify.sh
